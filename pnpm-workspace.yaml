packages:
  - packages/*
  - plugins/*
  - apps/*
  # Les copies de projet qu'écrivent les cas de rechargement. Sans cette
  # exclusion, un `pnpm install` lancé pendant qu'une copie existe l'inscrit dans
  # le fichier de verrouillage. Mesuré.
  - '!apps/tmp-demo-*'

catalogMode: prefer

catalog:
  '@changesets/changelog-github': ^0.7.0
  '@changesets/cli': ^2.31.1
  '@hugeicons/core-free-icons': ^4.3.5
  '@hugeicons/vue': ^1.0.8
  '@types/node': ^24
  '@vitest/coverage-v8': 4.1.10
  '@vue/test-utils': ^2.4.11
  babel-plugin-react-compiler: ^1.0.0
  jsdom: ^30.0.1
  marked: ^18.1.1
  playwright: ^1.62.1
  reka-ui: ^2.10.5
  tsconfck: ^3.1.6
  # Version exacte et pas une plage : l'API de génération de types n'est pas
  # stable, et une version corrective en changerait le comportement chez les
  # consommateurs. La lignée 6 tient à vue-tsc, qui charge un chemin de l'API
  # programmatique que la 7 n'expose plus. vp pack émet les déclarations publiées
  # avec le TypeScript que la racine déclare, celui-ci : sans lui à la racine, un
  # 7 pair de vite-plus s'installait d'office, émettait, et ne posait plus de
  # `tsc` à la racine, où les tests de types le cherchent. Mesuré : les `.d.ts`
  # des deux ne diffèrent que par les guillemets d'une constante.
  typescript: 6.0.3
  vite: ^8.2.1
  vitest: ^4.1.10

# vue-demi, que tire @floating-ui/vue sous reka-ui : son script ne fait que
# basculer vers Vue 2, et la version publiée vise déjà Vue 3. Sans cette ligne,
# pnpm 11 sort en erreur à chaque installation, CI comprise.
allowBuilds:
  vue-demi: false
