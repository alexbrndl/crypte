name: Version

# Ce workflow ne publie rien. Il maintient la pull request « Version Packages »
# qui accumule les changesets. La publication npm viendra séparément.
# Voir docs/internal/architecture.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: '24'
          cache: true
      - run: vp install

      # Sans `publish`, l'action se limite à ouvrir et tenir à jour la pull request
      # de version. Ajouter cette entrée publierait sur npm.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: vp exec changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
