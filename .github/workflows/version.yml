name: Version

# Ce workflow ne publie rien. Il maintient la pull request « Version Packages »
# qui accumule les changesets. La publication npm viendra séparément.
# Voir docs/internal/architecture.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '24'
          cache: true
      - run: vp install

      # Sans `publish-script`, l'action se limite à ouvrir et tenir à jour la pull
      # request de version. Ajouter cette entrée publierait sur npm.
      #
      # `github-token` reste implicite, son défaut étant `${{ github.token }}`.
      # Le bloc `env` n'est pas pour l'action mais pour le script de version :
      # `@changesets/get-github-info` lève sans `GITHUB_TOKEN`, et c'est lui qui
      # met les liens de pull request dans le changelog.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp exec changeset version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
