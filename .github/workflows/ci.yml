name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 20, et non 10. Le retrait du contrôle de mutation avait fait descendre ce
    # chiffre sur une mesure de moins de 2 min, prise quand le navigateur était
    # déjà là. L'installation de Chromium a coûté 9 min 11 une fois, ce que
    # `docs/internal/suivi.md` disait, et le job s'est fait tuer à 10 min 17.
    # Un budget se change en relisant ce que le registre en dit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install
      # pack avant check : les paquets exposent leurs types depuis dist/, que la
      # vérification de types doit pouvoir résoudre. Avant test aussi, le test
      # d'isolation lisant les bundles construits.
      - run: vp run -r pack
      - run: vp check
      # vp check ne lit pas les composants monofichiers Vue : leur contenu, template
      # compris, n'est vérifié que par vue-tsc. Voir docs/internal/architecture.md.
      - run: vp run -r typecheck
      # Le navigateur des cas d'écran. Sans lui `chromium.launch()` échoue sur
      # un exécutable absent, et le seul contrôle qui voit ce que l'utilisateur
      # voit tombe. Voir docs/internal/architecture.md.
      #
      # En cache sur la version du catalogue : 95 Mo par exécution et par version
      # de Node, et une fois 9 min 11 à lui seul. Les paquets système ne vivent
      # pas dans ce dossier, d'où les deux étapes qui suivent.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}
      # Sur une touche, pas d'`apt` : sur les lancements rapides il n'avait rien à
      # installer, donc l'image porte déjà les bibliothèques de Chromium. Deux
      # fois pourtant il a mangé le budget entier du job, tué à 20 min sans une
      # ligne d'erreur. Voir docs/internal/suivi.md.
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: vp node node_modules/playwright/cli.js install chromium
      # Sur un manque, les paquets système en plus, et une borne à l'étape : un
      # échec à 8 min dit ce qui a traîné, une annulation du job à 20 ne dit rien.
      - if: steps.chromium.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: vp node node_modules/playwright/cli.js install --with-deps chromium
      # `--coverage` produit la mesure ; le verdict est rendu par le job
      # `coverage`, une seule fois, là où il est visible. Sans le drapeau, il n'y
      # a rien à juger et un fichier publié peut retomber à 0 % d'exécution sans
      # un mot.
      #
      # `github-actions` annote les fichiers du diff aux lignes qui échouent, ce
      # qui évite d'ouvrir les journaux pour savoir quoi. `json` écrit le compte
      # que le résumé et le commentaire affichent.
      # Voir docs/internal/architecture.md.
      - run: >
          vp test --coverage
          --reporter=default --reporter=github-actions
          --reporter=json --outputFile=vitest-report.json
      # Le résumé et le compte partent au job `coverage`, qui les affiche et
      # commente. `always()` : un lancement rouge doit pouvoir dire son compte.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # `!cancelled()` et non `always()` : un lancement annulé par le suivant
        # n'a rien à déposer, et le job d'à côté rougirait sur un artefact absent.
        if: ${{ !cancelled() && matrix.node == '24' }}
        with:
          name: coverage-summary
          # Aucun chemin caché : `upload-artifact` écarte les fichiers en point
          # par défaut, et le rapport s'appelait `.vitest-report.json`. Le
          # commentaire annonçait alors « résultat des tests indisponible ».
          path: |
            coverage/coverage-summary.json
            vitest-report.json
          if-no-files-found: ignore
      # Deux choses sont écrites par la suite et commitées : les réexports
      # générés, et l'empreinte de la fixture. Le régime est celui d'un fichier
      # de verrouillage, et ce diff en est le contrôle : le réparer, c'est
      # relancer la suite puis commiter. Voir docs/internal/architecture.md.
      #
      # `ls-files` avant le diff : `git diff` ne voit que ce qui est suivi, donc
      # une empreinte sortie de l'index laisserait cette étape verte et le
      # verrou s'éteindrait sans bruit.
      - name: Generated files are up to date
        run: |
          git ls-files --error-unmatch packages/cli/test/fixture/.crypte/fingerprint.json apps/demo/.crypte/fingerprint.json
          git diff --exit-code

  # Un contrôle nommé sur la pull request, plutôt qu'un chiffre enterré dans les
  # journaux d'un autre job. Il affiche le tableau, le commente, et rend le
  # verdict : c'est le seul endroit où les seuils sont évalués, vitest ne les
  # porte pas.
  # Voir docs/internal/architecture.md.
  coverage:
    if: ${{ !cancelled() }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
      # Une seule commande pour les trois sorties : le tableau sur la page du
      # job, le commentaire quand c'est une pull request de ce dépôt, et le code
      # de sortie qui décide du contrôle. Jamais depuis une bifurcation, dont le
      # jeton est en lecture seule.
      - name: Report coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR: >-
            ${{ (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository)
            && github.event.pull_request.number || '' }}
        run: |
          node test/coverage-report.mjs \
            ${PR:+--pr "$PR"} \
            --sha "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # Le badge du README est commité, pas poussé par un robot : une règle du
      # dépôt exige que tout passe par une pull request, donc la pousse d'un job
      # était refusée et la CI de `main` rougissait à chaque fusion qui bougeait
      # le chiffre. `DCJ-225`.
      #
      # Ici on vérifie seulement que le fichier commité dit le chiffre mesuré.
      # Aucun droit d'écriture, aucune branche, et `pnpm ready` le régénère.
      - name: Le badge commité dit le chiffre mesuré
        run: |
          node test/coverage-report.mjs --badge /tmp/coverage.json > /dev/null
          diff /tmp/coverage.json .github/coverage.json && exit 0
          echo "::error::Le badge de .github/coverage.json est périmé. Si cette branche ne touche pas la couverture, fusionner \`main\` dedans suffit : le badge y est déjà à jour. Sinon, lancer \`vp test --coverage && node test/coverage-report.mjs --badge .github/coverage.json\` et commiter le fichier."
          exit 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Seul job exigé par le ruleset. Voir docs/internal/architecture.md.
  ci-passed:
    if: always()
    needs: [check, coverage, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Une dépendance a échoué ou a été annulée
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Tous les contrôles sont passés."
