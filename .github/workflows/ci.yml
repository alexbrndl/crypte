name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # `pull-requests: write` pour le seul commentaire de couverture. Le jeton
    # d'une pull request venue d'une bifurcation reste en lecture seule quoi
    # qu'on écrive ici, d'où la garde sur l'étape. Voir docs/internal/architecture.md.
    permissions:
      contents: read
      pull-requests: write
    # 10 depuis le retrait du contrôle de mutation, qui lançait un test par
    # garantie et demandait 20. Mesuré ici sur le job entier : moins de 2 min.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install
      # pack avant check : les paquets exposent leurs types depuis dist/, que la
      # vérification de types doit pouvoir résoudre. Avant test aussi, le test
      # d'isolation lisant les bundles construits.
      - run: vp run -r pack
      - run: vp check
      # vp check ne lit pas les composants monofichiers Vue : leur contenu, template
      # compris, n'est vérifié que par vue-tsc. Voir docs/internal/architecture.md.
      - run: vp run -r typecheck
      # Le navigateur des cas d'écran. Sans lui `chromium.launch()` échoue sur
      # un exécutable absent, et le seul contrôle qui voit ce que l'utilisateur
      # voit tombe. Voir docs/internal/architecture.md.
      - run: vp node node_modules/playwright/cli.js install --with-deps chromium
      # `--coverage` : les seuils sont dans vite.config.ts, et c'est ici qu'ils
      # gardent quelque chose. Sans le drapeau, ils ne sont jamais évalués et un
      # fichier publié peut retomber à 0 % d'exécution sans un mot.
      #
      # `github-actions` annote les fichiers du diff aux lignes qui échouent, ce
      # qui évite d'ouvrir les journaux pour savoir quoi. `json` écrit le compte
      # que le résumé et le commentaire affichent.
      # Voir docs/internal/architecture.md.
      - run: >
          vp test --coverage
          --reporter=default --reporter=github-actions
          --reporter=json --outputFile=.vitest-report.json
      # Le tableau sur la page du job, quel que soit le déclencheur. Le rapport
      # de couverture vivait dans les journaux, que personne n'ouvre.
      - name: Tests and coverage summary
        if: always() && matrix.node == '24'
        # Informatif : un rapport manquant ne doit pas masquer l'échec qui l'a
        # empêché d'exister. La porte est l'étape de test, pas celle-ci.
        continue-on-error: true
        run: node test/coverage-report.mjs --sha "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      # Et le même tableau en commentaire de pull request, remplacé en place.
      # Une seule entrée de matrice le poste : deux se marcheraient dessus.
      # Jamais depuis une bifurcation, dont le jeton est en lecture seule.
      - name: Comment coverage on the pull request
        if: >
          always() && matrix.node == '24' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node test/coverage-report.mjs --pr "${{ github.event.pull_request.number }}" --sha "${{ github.sha }}" > /dev/null
      # Deux choses sont écrites par la suite et commitées : les réexports
      # générés, et l'empreinte de la fixture. Le régime est celui d'un fichier
      # de verrouillage, et ce diff en est le contrôle : le réparer, c'est
      # relancer la suite puis commiter. Voir docs/internal/architecture.md.
      #
      # `ls-files` avant le diff : `git diff` ne voit que ce qui est suivi, donc
      # une empreinte sortie de l'index laisserait cette étape verte et le
      # verrou s'éteindrait sans bruit.
      - name: Generated files are up to date
        run: |
          git ls-files --error-unmatch packages/cli/test/fixture/.crypte/fingerprint.json apps/demo/.crypte/fingerprint.json
          git diff --exit-code

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Seul job exigé par le ruleset. Voir docs/internal/architecture.md.
  ci-passed:
    if: always()
    needs: [check, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Une dépendance a échoué ou a été annulée
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Tous les contrôles sont passés."
