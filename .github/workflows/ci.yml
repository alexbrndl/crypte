name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 20 et non 10 à cause du contrôle de mutation, qui lance un test par
    # garantie. Mesuré ici sur le job entier : 12 min 2 avant son accélération,
    # 5 min 45 après. Voir docs/internal/architecture.md.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install
      # pack avant check : les paquets exposent leurs types depuis dist/, que la
      # vérification de types doit pouvoir résoudre. Avant test aussi, le test
      # d'isolation lisant les bundles construits.
      - run: vp run -r pack
      - run: vp check
      # vp check ne lit pas les composants monofichiers Vue : leur contenu, template
      # compris, n'est vérifié que par vue-tsc. Voir docs/internal/architecture.md.
      - run: vp run -r typecheck
      # Le navigateur des cas d'écran. Sans lui `chromium.launch()` échoue sur
      # un exécutable absent, et le seul contrôle qui voit ce que l'utilisateur
      # voit tombe. Voir docs/internal/architecture.md.
      - run: vp node node_modules/playwright/cli.js install --with-deps chromium
      - run: vp test
      # Deux choses sont écrites par la suite et commitées : les réexports
      # générés, et l'empreinte de la fixture. Le régime est celui d'un fichier
      # de verrouillage, et ce diff en est le contrôle : le réparer, c'est
      # relancer la suite puis commiter. Voir docs/internal/architecture.md.
      #
      # `ls-files` avant le diff : `git diff` ne voit que ce qui est suivi, donc
      # une empreinte sortie de l'index laisserait cette étape verte et le
      # verrou s'éteindrait sans bruit.
      - name: Generated files are up to date
        run: |
          git ls-files --error-unmatch packages/cli/test/fixture/.crypte/fingerprint.json apps/demo/.crypte/fingerprint.json
          git diff --exit-code
      # Le contrôle de mutation n'est plus ici : son coût est « nombre de
      # garanties × toute la suite », donc il grandit à chaque lot. Sept minutes
      # à 98 garanties, plus de vingt à 131, et le job s'est fait tuer. La porte
      # de pull request tient en quatre secondes sans lui.
      # Il tourne chaque nuit, dans mutations.yml. Voir docs/internal/architecture.md.

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Seul job exigé par le ruleset. Voir docs/internal/architecture.md.
  ci-passed:
    if: always()
    needs: [check, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Une dépendance a échoué ou a été annulée
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Tous les contrôles sont passés."
