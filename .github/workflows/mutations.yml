# Casse chaque garantie du catalogue et vérifie que le bon test s'en aperçoit.
#
# Hors de la porte de pull request : son coût est « nombre de garanties × toute
# la suite », donc il grandit à chaque lot, et il a fini par dépasser le budget
# du job. Personne n'attend derrière une tâche de nuit.
#
# Avant une revue, il se lance à la main sur ce que le diff touche :
# `node test/mutation-check.mjs --depuis origin/main`.
name: Guarantees

# Il ne fait que lire le dépôt et lancer des commandes locales.
permissions:
  contents: read

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  guarded:
    runs-on: ubuntu-latest
    # Large, parce que rien ne dépend de lui : mieux vaut un verdict lent qu'un
    # verdict tronqué, qui est ce que le budget de vingt minutes produisait.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp node node_modules/playwright/cli.js install --with-deps chromium
      - name: Guarantees are actually guarded
        run: node test/mutation-check.mjs
        env:
          VP_BIN: vp
