name: Require review

# Ce workflow ne produit aucune revue. Il vérifie seulement qu'une revue existe,
# et seulement quand le diff en mérite une.
# La revue est produite en local par le skill /review. Voir docs/internal/architecture.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  has-review:
    # Le flux impose le brouillon avant la revue : contrôler une pull request encore
    # en brouillon, c'est échouer à coup sûr et notifier pour rien. Le type
    # ready_for_review déclenche le contrôle au moment où la réponse peut être oui.
    #
    # La pull request de version est ouverte par un robot depuis changeset-release/* :
    # personne ne peut y lancer /review, l'exiger la bloquerait définitivement.
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Le numéro de pull request est résolu une fois pour les deux étapes, et la
      # nature du diff avec lui : dupliquer la résolution ferait dériver les deux.
      #
      # Rien ne sort d'ici que des nombres et un booléen, jamais un nom de fichier,
      # pour la même raison que l'étape suivante ne sort jamais le corps d'un
      # commentaire : une chaîne venue du dépôt pourrait porter une commande de
      # workflow, `::error::` ou `::add-mask::`.
      - name: Contexte, et nature du diff
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Sur workflow_dispatch, l'événement ne porte aucun numéro de PR : le retrouver
          # depuis la branche, sinon le contrôle passerait au vert sans avoir rien lu.
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number --jq '.[0].number // empty')
          fi

          if [ -z "$PR" ]; then
            echo "::error::Aucune pull request ouverte pour cette branche."
            exit 1
          fi

          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          # --slurp agrège les pages et jq travaille en aval, comme pour le comptage
          # des revues : avec --paginate, un filtre agrégeant passé à --jq s'applique
          # page par page et rend un résultat faux.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --slurp \
            | jq -r '.[][].filename')

          # Une liste vide veut dire qu'on n'a rien pu lire, pas que le diff est vide.
          # On exige alors une revue : bloquer est la direction sûre.
          if [ -z "$files" ]; then
            echo "Aucun fichier listé, une revue est exigée."
            echo "prose=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # De la prose se relit sans procédure. Quatre formes n'en sont pas, malgré
          # leur extension : deux font foi, et `CLAUDE.md` comme les skills portent les
          # règles de travail, donc une erreur dedans se propage à toutes les sessions.
          #
          # Les skills ont été ajoutés après avoir éprouvé ce classement sur onze cas :
          # un diff ne touchant que `.claude/skills/review/SKILL.md` passait pour de la
          # prose, et se serait donc exempté de la revue du mécanisme de revue.
          prose=true
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            case "$f" in
              docs/contracts.md|docs/decisions.md|CLAUDE.md) prose=false ;;
              .claude/*) prose=false ;;
              *.md) ;;
              *) prose=false ;;
            esac
          done <<< "$files"

          echo "prose=$prose" >> "$GITHUB_OUTPUT"
          echo "Fichiers au diff : $total"

          if [ "$prose" = true ]; then
            echo "Prose seule, aucune revue exigée."
          fi

      # Seuls des nombres sortent de ces appels, jamais le corps des commentaires :
      # un texte produit par un agent pourrait contenir des commandes de workflow.
      - name: Chercher le marqueur de revue
        if: steps.ctx.outputs.prose != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- crypte-review -->'

          # --paginate avec --jq applique le filtre page par page et renvoie une ligne
          # par page, ce qui casse l'addition au-delà de 30 commentaires. --slurp agrège
          # les pages mais n'accepte pas --jq, d'où le passage par jq en aval.
          count() {
            gh api "$1" --paginate --slurp \
              | jq --arg m "$marker" '[.[][] | select((.body // "") | contains($m))] | length'
          }

          comments=$(count "repos/$REPO/issues/$PR/comments")
          reviews=$(count "repos/$REPO/pulls/$PR/reviews")

          total=$((comments + reviews))
          echo "Revues trouvées : $total"

          if [ "$total" -eq 0 ]; then
            echo "::error::Aucune revue trouvée. Lancer /review en local avant de fusionner, puis relancer ce contrôle."
            exit 1
          fi

          # Une revue existe, mais de quand ? Le contrôle ne peut pas exiger qu'elle
          # soit postérieure au dernier commit : corriger un point non bloquant sans
          # relancer de tour est permis, et le durcir rendrait ces deux règles
          # contradictoires. Il dit donc l'écart, et laisse juger.
          last_review=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp \
            | jq -r --arg m "$marker" \
              '[.[][] | select((.body // "") | contains($m)) | .submitted_at] | max // ""')
          head_date=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' \
            | xargs -I{} gh api "repos/$REPO/commits/{}" --jq '.commit.committer.date')

          echo "Revue la plus récente : ${last_review:-inconnue}"
          echo "Dernier commit        : $head_date"

          if [ -n "$last_review" ] && [[ "$last_review" < "$head_date" ]]; then
            echo "::warning::La revue la plus récente précède le dernier commit. Vérifier que rien de bloquant n'a été ajouté depuis."
          fi
