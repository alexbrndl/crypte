name: Require review

# Ce workflow ne produit aucune revue. Il vérifie qu'une revue existe, et seulement
# quand le diff en mérite une : de la prose se relit sans procédure.
# La revue est produite en local par le skill /review. Voir docs/internal/architecture.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  has-review:
    # Le flux impose le brouillon avant la revue : contrôler une pull request encore
    # en brouillon, c'est échouer à coup sûr et notifier pour rien. Le type
    # ready_for_review déclenche le contrôle au moment où la réponse peut être oui.
    #
    # La pull request de version est ouverte par un robot depuis changeset-release/* :
    # personne ne peut y lancer /review, l'exiger la bloquerait définitivement.
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Le script n'a aucune dépendance : Node et gh sont fournis par le runner,
      # donc ni installation ni construction. Le classement qui décide de l'exemption
      # y vit plutôt qu'ici, pour être couvert par test/review-check.test.mjs.
      - name: Chercher le marqueur de revue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Par l'environnement, jamais interpolé dans la commande : la règle vaut
          # pour tout `github.event`, même un nombre.
          PR: ${{ github.event.pull_request.number }}
        # Sans numéro, sur workflow_dispatch, le script le retrouve depuis la
        # branche : `gh pr view` a besoin du dépôt cloné, d'où le checkout.
        run: node test/review-check.mjs $PR
